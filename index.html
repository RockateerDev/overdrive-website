<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Overdrive Games — independent game studio.">
  <title>Overdrive Games</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=Orbitron:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="assets/video/gridBackground.mp4" type="video/mp4">
  </video>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo glint" href="./">Overdrive Games</a>
      <nav class="nav" aria-label="Main">
        <a href="./" aria-current="page">Home</a>
        <a href="about/">About</a>
        <a href="contact/">Contact</a>
        <a href="games/">Games</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero-inner">
        <p class="eyebrow">Independent studio</p>
        <h1 class="glint">Under Construction...</h1>
        <p class="lede">Drawing attention to the future past.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="games/">View games</a>
          <a class="btn btn-ghost" href="contact/">Get in touch</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© <span id="y"></span> Overdrive Games</span>
    </div>
  </footer>
  <div class="retro-overlay"></div>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
  <script src="script.js"></script>
</body>
</html>
