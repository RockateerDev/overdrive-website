<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Overdrive Games - independent game studio.">
  <title>Overdrive Games</title>
  <link rel="icon" href="assets/logos/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600&family=Orbitron:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <img class="bg-video" src="assets/background/background.png" alt="" aria-hidden="true" decoding="async">
  <div class="bg-dim" aria-hidden="true"></div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="./">
        <img class="logo-mark" src="assets/logos/Overdrive%20Games%20Pictorial%20Logo.png" alt="" decoding="async">
        <span class="logo-word glint">Overdrive Games</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="./" aria-current="page">Home</a>
        <a href="about/">About</a>
        <a href="games/">Games</a>
        <a href="contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main class="hero hero--home">
    <a class="home-logo-wrap" href="about/">
      <div class="home-logo-bolts" aria-hidden="true"></div>
      <span class="home-logo-scale">
        <img
          class="home-logo"
          src="assets/logos/Overdrive%20Games%20Logo.png"
          alt="Overdrive Games"
          decoding="async"
        >
      </span>
    </a>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© <span id="y"></span> Overdrive Games</span>
    </div>
  </footer>
  <div class="retro-overlay"></div>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
  <script src="script.js"></script>
</body>
</html>
